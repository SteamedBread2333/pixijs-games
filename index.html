<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>小游戏盒子</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1c2333, #0d0f1a);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    #app {
      opacity: 0;
      transition: opacity 220ms ease;
    }
    #app.is-ready {
      opacity: 1;
    }
    #app canvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, #273653, #0d0f1a 72%);
      z-index: 1;
      transition: opacity 180ms ease;
    }
    #loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-card {
      min-width: 220px;
      padding: 28px 32px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: rgba(20, 27, 43, 0.92);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #7ca6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading.has-error .loading-spinner {
      display: none;
    }
    #loading-message {
      font-size: 15px;
      line-height: 1.6;
      color: #dce6fb;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div id="loading-message">正在加载游戏资源…</div>
    </div>
  </div>
  <div id="app" aria-hidden="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
